[project]
name = "feishu-bot-demo"
version = "0.1.0"
description = "Feishu bot demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feishu_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 注释、文档字符串和面向用户的提示文案都用中文写，全角标点是正确写法而不是"歧义
# 字符"。RUF001/002/003 分不出"中文里正常的全角标点"和"混进来的同形字符"，在这个
# 代码库里只会刷噪声（实测 24 条命中全部是中文文案），所以三条一起放行。
ignore = ["RUF001", "RUF002", "RUF003"]
